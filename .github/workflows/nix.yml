name: Nix

on: # yamllint disable-line rule:truthy
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "**.go"
      - go.mod
      - go.sum
      - flake.nix
      - flake.lock
      - .github/workflows/nix.yml

# Writes the refreshed vendorHash back to the PR branch, Dependabot's included (its runs get a
# read-only token unless the workflow asks for more).
permissions:
  contents: write

defaults:
  run:
    shell: bash -Eeuo pipefail {0}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build flake
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref || github.ref }}

      - uses: DeterminateSystems/determinate-nix-action@16f94ba7aae399b9f9077c254b6719ec6de7e3e3 # v3.24.2

      # A go.sum change makes vendorHash stale, and the nix-darwin install of this tool then stops
      # building. Build once; on a hash mismatch, write the hash Nix reports, build again to prove
      # it, and push the fix. Any other failure (the code no longer compiles) fails the run.
      - name: Build, refreshing vendorHash if go.sum changed
        run: |
          if out="$(nix build -L .#packages.x86_64-linux.default 2>&1)"; then
            exit 0
          fi
          hash="$(sed -n 's/^ *got: *\(sha256-[^ ]*\).*/\1/p' <<<"$out" | tail -1)"
          if [[ -z $hash ]]; then
            tail -60 <<<"$out"
            exit 1
          fi
          sed -i "s|vendorHash = \"[^\"]*\";|vendorHash = \"$hash\";|" flake.nix
          nix build -L .#packages.x86_64-linux.default
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "build(nix): update vendorHash for go.sum change"
          git push
