name: CI

on: # yamllint disable-line rule:truthy
  workflow_dispatch: # Manual trigger
  workflow_call: # Call from another workflow
  push:
    branches: [master, main]
    paths:
      - "**.go"
  pull_request:
    branches: [master, main]
    paths:
      - "**.go"

permissions:
  contents: read

defaults:
  run:
    shell: bash -Eeuo pipefail {0}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  run:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Restore cached CI Dependencies
        id: cache-ci-dependencies-restore
        uses: actions/cache/restore@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: |
            /usr/local/bin/gotestfmt
          key: ${{ runner.os }}-ci-dependencies

      - name: Install Go
        id: cache-go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: 'go.mod'

      - name: Install `gotestfmt`
        if: steps.cache-ci-dependencies-restore.outputs.cache-hit != 'true'
        # Install gotestfmt for test output formatting
        run: |
          go install github.com/gotesttools/gotestfmt/v2/cmd/gotestfmt@latest
          mv /home/runner/go/bin/gotestfmt /usr/local/bin/

      - name: Save CI dependencies
        id: cache-ci-dependencies-save
        if: steps.cache-ci-dependencies-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: |
            /usr/local/bin/gotestfmt
          key: ${{ steps.cache-ci-dependencies-restore.outputs.cache-primary-key }}

      - name: Go mod download
        if: steps.cache-go.outputs.cache-hit != 'true'
        run: go mod download -x

      - name: Go Build
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-w -s" -o /dev/null

      - name: Run tests
        run: |
          go test -short -json -v ./... 2>&1 | tee /tmp/gotest.log | gotestfmt

      - name: golangci-lint
        uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9.2.0
        with:
          args: "--timeout=2m --config=.golangci.yml"
          skip-save-cache: true
          skip-cache: true
