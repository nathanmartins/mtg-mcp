version: 2

updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    rebase-strategy: disabled
    groups:
      github-actions-dependencies:
        patterns:
          - "*"
    labels:
      - dependencies
      - gha

  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    rebase-strategy: disabled
    groups:
      gomod-dependencies:
        patterns:
          - "*"
    labels:
      - dependencies
      - golang
